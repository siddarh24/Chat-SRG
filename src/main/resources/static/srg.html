<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChatSRG - AI Assistant</title>


    <style>

        /* =========================
           GLOBAL
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(123, 92, 255, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(0, 212, 255, 0.12),
                    transparent 30%
                ),
                #070b18;

            color: #ffffff;

            overflow: hidden;
        }


        /* =========================
           APP
        ========================== */

        .app {
            height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.08);

            background:
                rgba(7, 11, 24, 0.75);

            backdrop-filter: blur(20px);
        }


        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .brand-icon {
            width: 42px;
            height: 42px;

            border-radius: 14px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-weight: 500;
            font-size: 30px;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #00d4ff
                );

            box-shadow:
                0 0 25px rgba(0, 212, 255, 0.25);
        }


        .brand-name {
            font-size: 25px;
            font-weight: 800;

            letter-spacing: -1px;
        }


        .brand-name span {
            background:
                linear-gradient(
                    90deg,
                    #a855f7,
                    #00d4ff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        .status {
            display: flex;
            align-items: center;

            gap: 8px;

            padding: 9px 15px;

            border:
                1px solid rgba(0, 212, 255, 0.25);

            border-radius: 30px;

            background:
                rgba(0, 212, 255, 0.06);

            font-size: 13px;

            color: #c9d7ff;
        }


        .status-dot {
            width: 8px;
            height: 8px;

            background: #35e58c;

            border-radius: 50%;

            box-shadow:
                0 0 12px #35e58c;
        }


        /* =========================
           MAIN
        ========================== */

        .main {
            flex: 1;

            display: flex;

            min-height: 0;

            padding: 18px;

            gap: 18px;
        }


        /* =========================
           SIDEBAR
        ========================== */

        .sidebar {
            width: 260px;

            display: flex;
            flex-direction: column;

            padding: 18px;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 22px;

            background:
                rgba(15, 20, 40, 0.72);

            backdrop-filter: blur(20px);
        }


        .new-chat {
            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 13px;

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    90deg,
                    #9333ea,
                    #2563eb
                );

            box-shadow:
                0 8px 25px rgba(80, 60, 200, 0.25);

            transition: 0.25s;
        }


        .new-chat:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(80, 60, 200, 0.4);
        }


        .sidebar-title {
            margin: 25px 5px 12px;

            font-size: 12px;

            color: #7883a5;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        .history {
            overflow-y: auto;
        }


        .history-item {
            padding: 12px;

            margin-bottom: 6px;

            border-radius: 12px;

            color: #c9d0e8;

            font-size: 13px;

            cursor: pointer;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            transition: 0.2s;
        }


        .history-item:hover {
            background:
                rgba(139, 92, 246, 0.12);

            color: white;
        }


        .sidebar-bottom {
            margin-top: auto;

            padding: 14px;

            border-radius: 15px;

            text-align: center;

            font-size: 12px;

            color: #818baa;

            background:
                rgba(255, 255, 255, 0.03);
        }


        .sidebar-bottom strong {
            color: #a855f7;
        }


        /* =========================
           CHAT AREA
        ========================== */

        .chat-container {
            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 22px;

            background:
                rgba(10, 15, 31, 0.75);

            backdrop-filter: blur(25px);

            overflow: hidden;
        }


        .chat-header {
            padding: 18px 22px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.07);
        }


        .chat-title {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        .ai-avatar {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    90deg,
                    #a855f7,
                    #00d4ff
                );

            font-weight: 500;

            font-size: 24px;

            color: white;
        }


        .chat-title h2 {
            font-size: 16px;
        }


        .chat-title small {
            display: block;

            color: #6f7a9b;

            font-size: 11px;

            margin-top: 3px;
        }


        .header-buttons {
            display: flex;

            gap: 8px;
        }


        .icon-btn {
            width: 36px;
            height: 36px;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 11px;

            background:
                rgba(255, 255, 255, 0.03);

            color: #aeb7d3;

            cursor: pointer;

            transition: 0.2s;
        }


        .icon-btn:hover {
            background:
                rgba(139, 92, 246, 0.15);

            color: white;
        }


        /* =========================
           MESSAGES
        ========================== */

        .messages {
            flex: 1;

            overflow-y: auto;

            padding: 28px;

            scroll-behavior: smooth;
        }


        .welcome {
            text-align: center;

            max-width: 600px;

            margin: 45px auto;
        }


        .welcome h1 {
            margin-top: 22px;

            font-size: 34px;

            letter-spacing: -1px;
        }


        .welcome h1 span {
            background:
                linear-gradient(
                    90deg,
                    #a855f7,
                    #00d4ff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .welcome p {
            margin-top: 10px;

            color: #7f8aa8;

            font-size: 14px;
        }


        .suggestions {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-top: 28px;
        }


        .suggestion {
            padding: 14px;

            text-align: left;

            border:
                1px solid rgba(255, 255, 255, 0.07);

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.025);

            color: #b8c1da;

            cursor: pointer;

            transition: 0.2s;
        }


        .suggestion:hover {
            border-color:
                rgba(139, 92, 246, 0.4);

            background:
                rgba(139, 92, 246, 0.08);

            transform: translateY(-2px);
        }


        /* =========================
           MESSAGE
        ========================== */

        .message {
            display: flex;

            gap: 12px;

            margin-bottom: 22px;

            animation:
                appear 0.3s ease;
        }


        @keyframes appear {

            from {
                opacity: 0;

                transform:
                    translateY(8px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        .message.user {
            justify-content: flex-end;
        }


        .message-avatar {
            width: 34px;
            height: 34px;

            min-width: 34px;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #06b6d4
                );
        }


        .message.user .message-avatar {
            order: 2;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );
        }


        .bubble {
            max-width: 78%;

            padding: 13px 16px;

            border-radius: 17px;

            color: #e8ecf8;

            line-height: 1.6;

            font-size: 14px;

            background:
                rgba(255, 255, 255, 0.045);

            border:
                1px solid rgba(255, 255, 255, 0.06);

            overflow-wrap: anywhere;
        }


        .message.user .bubble {
            border: none;

            background:
                linear-gradient(
                    135deg,
                    #5730d6,
                    #4031ad
                );

            border-bottom-right-radius: 5px;
        }


        .message.ai .bubble {
            border-bottom-left-radius: 5px;
        }


        .message-time {
            display: block;

            margin-top: 6px;

            font-size: 10px;

            color: #69738f;
        }


        /* =========================
           MARKDOWN CONTENT
        ========================== */

        .markdown-content p {
            margin: 0 0 12px;
        }


        .markdown-content p:last-child {
            margin-bottom: 0;
        }


        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            margin: 14px 0 8px;

            color: white;

            line-height: 1.3;
        }


        .markdown-content h1 {
            font-size: 22px;
        }


        .markdown-content h2 {
            font-size: 19px;
        }


        .markdown-content h3 {
            font-size: 17px;
        }


        .markdown-content strong {
            color: white;

            font-weight: 700;
        }


        .markdown-content em {
            font-style: italic;
        }


        .markdown-content ul,
        .markdown-content ol {
            margin: 8px 0 12px 24px;
        }


        .markdown-content li {
            margin: 5px 0;
        }


        .markdown-content blockquote {
            margin: 10px 0;

            padding: 8px 14px;

            border-left:
                3px solid #8b5cf6;

            background:
                rgba(139, 92, 246, 0.07);

            color: #b8c1da;
        }


        .inline-code {
            padding: 2px 6px;

            border-radius: 5px;

            background:
                rgba(255, 255, 255, 0.10);

            color: #e4c8ff;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 13px;
        }


        /* =========================
           CODE BLOCK
        ========================== */

        .code-block {
            margin: 14px 0;

            border:
                1px solid rgba(255, 255, 255, 0.10);

            border-radius: 12px;

            overflow: hidden;

            background: #080b14;
        }


        .code-header {
            height: 38px;

            padding: 0 12px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(255, 255, 255, 0.055);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.07);

            color: #9da8c5;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 11px;
        }


        .copy-code {
            border: none;

            border-radius: 6px;

            padding: 5px 9px;

            background:
                rgba(255, 255, 255, 0.07);

            color: #aeb7d3;

            cursor: pointer;

            font-size: 11px;

            transition: 0.2s;
        }


        .copy-code:hover {
            background:
                rgba(139, 92, 246, 0.25);

            color: white;
        }


        .code-block pre {
            margin: 0;

            padding: 16px;

            overflow-x: auto;

            white-space: pre;
        }


        .code-block pre code {
            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 13px;

            line-height: 1.65;

            color: #e8ecf8;
        }


        /* =========================
           TYPING
        ========================== */

        .typing {
            display: none;

            align-items: center;

            gap: 5px;

            margin-bottom: 20px;
        }


        .typing .message-avatar {
            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #06b6d4
                );
        }


        .typing-dots {
            padding: 12px 16px;

            border-radius: 16px;

            background:
                rgba(255, 255, 255, 0.04);
        }


        .typing-dots span {
            display: inline-block;

            width: 6px;
            height: 6px;

            margin: 0 2px;

            border-radius: 50%;

            background: #9ca7c7;

            animation:
                bounce 1.2s infinite;
        }


        .typing-dots span:nth-child(2) {
            animation-delay: 0.15s;
        }


        .typing-dots span:nth-child(3) {
            animation-delay: 0.3s;
        }


        @keyframes bounce {

            0%,
            60%,
            100% {
                transform:
                    translateY(0);
            }

            30% {
                transform:
                    translateY(-5px);
            }
        }


        /* =========================
           INPUT
        ========================== */

        .input-area {
            padding: 16px 20px 20px;
        }


        .input-wrapper {
            display: flex;

            align-items: flex-end;

            gap: 10px;

            padding: 10px;

            border-radius: 17px;

            border:
                1px solid rgba(139, 92, 246, 0.25);

            background:
                rgba(7, 11, 24, 0.8);

            box-shadow:
                0 0 30px rgba(0, 0, 0, 0.15);
        }


        .input-wrapper textarea {
            flex: 1;

            resize: none;

            max-height: 120px;

            border: none;

            outline: none;

            background: transparent;

            color: white;

            font-family: inherit;

            font-size: 14px;

            padding: 8px;
        }


        .input-wrapper textarea::placeholder {
            color: #59627d;
        }


        .attach-btn,
        .send-btn {
            width: 42px;
            height: 42px;

            border: none;

            border-radius: 13px;

            cursor: pointer;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 18px;
        }


        .attach-btn {
            background: transparent;

            color: #71809f;
        }


        .send-btn {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #9333ea,
                    #2563eb
                );

            box-shadow:
                0 5px 18px rgba(99, 60, 220, 0.3);

            transition: 0.2s;
        }


        .send-btn:hover {
            transform: scale(1.05);
        }


        .send-btn:disabled {
            opacity: 0.45;

            cursor: not-allowed;

            transform: none;
        }


        .input-footer {
            text-align: center;

            color: #4f5975;

            font-size: 10px;

            margin-top: 8px;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 800px) {

            body {
                overflow: auto;
            }


            .sidebar {
                display: none;
            }


            .main {
                padding: 10px;
            }


            .navbar {
                padding: 0 15px;
            }


            .status {
                display: none;
            }


            .messages {
                padding: 18px;
            }


            .welcome {
                margin: 25px auto;
            }


            .welcome h1 {
                font-size: 27px;
            }


            .suggestions {
                grid-template-columns: 1fr;
            }


            .bubble {
                max-width: 90%;
            }


            .code-block pre code {
                font-size: 12px;
            }
        }

    </style>

</head>


<body>


<div class="app">


    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="brand">

            <div class="brand-icon">
                S
            </div>

            <div class="brand-name">
                Chat<span>SRG</span>
            </div>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            Llama 3.2 • Online

        </div>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">


        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="sidebar">


            <button
                class="new-chat"
                onclick="newChat()">

                ＋ New Chat

            </button>


            <div class="sidebar-title">

                Recent Chats

            </div>


            <div
                class="history"
                id="history">

            </div>


            <div class="sidebar-bottom">

                Powered by
                <strong>ChatSRG</strong>

                <br>

                Local AI • Llama 3.2

            </div>


        </aside>



        <!-- =========================
             CHAT
        ========================== -->

        <section class="chat-container">


            <!-- CHAT HEADER -->

            <div class="chat-header">


                <div class="chat-title">


                    <div class="ai-avatar">
                        S
                    </div>


                    <div>

                        <h2>
                            ChatSRG AI
                        </h2>

                        <small>
                            Your intelligent local assistant
                        </small>

                    </div>


                </div>



                <div class="header-buttons">


                    <button
                        class="icon-btn"
                        title="Clear Chat"
                        onclick="clearChat()">

                        🗑

                    </button>


                </div>


            </div>



            <!-- =========================
                 MESSAGES
            ========================== -->

            <div
                class="messages"
                id="messages">


                <!-- WELCOME -->

                <div
                    class="welcome"
                    id="welcome">


                    <h1>
                        Welcome to
                        <span>ChatSRG</span>
                    </h1>


                    <p>

                        Your smart AI assistant powered by
                        <strong>Llama 3.2</strong>

                    </p>



                    <div class="suggestions">


                        <div
                            class="suggestion"
                            onclick="useSuggestion(
                                'What is artificial intelligence?'
                            )">

                            🧠 What is AI?

                        </div>



                        <div
                            class="suggestion"
                            onclick="useSuggestion(
                                'Give me information up to 2022'
                            )">

                            🌐 Information Up to 2022

                        </div>


                    </div>


                </div>



                <!-- TYPING -->

                <div
                    class="typing"
                    id="typing">


                    <div class="message-avatar">
                        🤖
                    </div>


                    <div class="typing-dots">

                        <span></span>

                        <span></span>

                        <span></span>

                    </div>


                </div>


            </div>



            <!-- =========================
                 INPUT
            ========================== -->

            <div class="input-area">


                <div class="input-wrapper">


                    <button
                        class="attach-btn"
                        title="File upload"
                        onclick="
                            document
                            .getElementById('fileInput')
                            .click()
                        ">

                        📎

                    </button>


                    <input
                        type="file"
                        id="fileInput"
                        hidden
                        onchange="fileSelected(event)">


                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Ask ChatSRG anything..."
                        onkeydown="handleKeyDown(event)"
                        oninput="resizeInput(this)">
                    </textarea>


                    <button
                        class="send-btn"
                        id="sendButton"
                        onclick="sendMessage()">

                        ➤

                    </button>


                </div>


                <div class="input-footer">

                    ChatSRG can make mistakes.
                    Verify important information.

                </div>


            </div>


        </section>


    </main>


</div>



<script>


    /* =========================
       ELEMENTS
    ========================== */

    const messageInput =
        document.getElementById("messageInput");

    const messages =
        document.getElementById("messages");

    const welcome =
        document.getElementById("welcome");

    const typing =
        document.getElementById("typing");

    const sendButton =
        document.getElementById("sendButton");

    const history =
        document.getElementById("history");



    /* =========================
       SEND MESSAGE
    ========================== */

    async function sendMessage() {


        const message =
            messageInput.value.trim();


        if (!message) {
            return;
        }


        // Hide welcome screen

        welcome.style.display = "none";


        // Add user question

        addMessage(
            "user",
            message
        );


        // Clear input

        messageInput.value = "";

        resizeInput(messageInput);


        // Disable button

        sendButton.disabled = true;


        // Show typing

        typing.style.display = "flex";


        scrollToBottom();



        try {


            /*
             * Spring Boot endpoint
             *
             * POST /api/chat
             */


            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })
                    }
                );



            if (!response.ok) {

                throw new Error(
                    "Server error: " +
                    response.status
                );

            }



            const data =
                await response.json();



            typing.style.display =
                "none";


            /*
             * LLM response
             */

            addMessage(
                "ai",
                data.response
            );


            addHistory(message);


        } catch (error) {


            console.error(error);


            typing.style.display =
                "none";


            addMessage(
                "ai",
                "⚠️ Unable to connect to ChatSRG server. Please make sure Spring Boot and Ollama are running."
            );


        } finally {


            sendButton.disabled =
                false;


            messageInput.focus();


            scrollToBottom();

        }

    }



    /* =========================
       ADD MESSAGE
    ========================== */

    function addMessage(type, text) {


        const wrapper =
            document.createElement("div");


        wrapper.className =
            "message " + type;



        const avatar =
            document.createElement("div");


        avatar.className =
            "message-avatar";


        avatar.textContent =
            type === "user"
                ? "👤"
                : "🤖";



        const bubble =
            document.createElement("div");


        bubble.className =
            "bubble";



        /*
         * USER MESSAGE
         *
         * User text should remain
         * plain text.
         */

        if (type === "user") {


            const content =
                document.createElement("div");


            content.textContent =
                text;


            bubble.appendChild(content);


        }


        /*
         * AI MESSAGE
         *
         * Convert Markdown into
         * properly formatted HTML.
         */

        else {


            const content =
                document.createElement("div");


            content.className =
                "markdown-content";


            content.innerHTML =
                formatMarkdown(text);


            bubble.appendChild(content);

        }



        const time =
            document.createElement("span");


        time.className =
            "message-time";


        time.textContent =
            getCurrentTime();


        bubble.appendChild(time);


        wrapper.appendChild(avatar);


        wrapper.appendChild(bubble);


        messages.insertBefore(
            wrapper,
            typing
        );


        scrollToBottom();

    }



    /* =========================
       MARKDOWN FORMATTER
    ========================== */

    function formatMarkdown(text) {


        if (!text) {
            return "";
        }


        /*
         * Normalize line endings
         */

        text =
            text.replace(/\r\n/g, "\n");


        /*
         * Escape HTML.
         *
         * This prevents the LLM from
         * inserting unwanted HTML/JS.
         */

        let html =
            escapeHtml(text);



        /*
         * =========================
         * CODE BLOCKS
         * =========================
         *
         * ```java
         * public class HelloWorld {
         * }
         * ```
         */


        html =
            html.replace(
                /```([a-zA-Z0-9_+#.-]+)?\n?([\s\S]*?)```/g,

                function (
                    match,
                    language,
                    code
                ) {


                    const lang =
                        language || "code";


                    const codeId =
                        "code-" +
                        Math.random()
                            .toString(36)
                            .substring(2, 10);


                    return `

                        <div class="code-block">

                            <div class="code-header">

                                <span>
                                    ${lang}
                                </span>

                                <button
                                    class="copy-code"
                                    onclick="copyCode('${codeId}', this)">

                                    Copy

                                </button>

                            </div>

                            <pre><code id="${codeId}">${code.trim()}</code></pre>

                        </div>

                    `;

                }
            );



        /*
         * =========================
         * HEADINGS
         * =========================
         */

        html =
            html.replace(
                /^### (.*)$/gm,
                "<h3>$1</h3>"
            );


        html =
            html.replace(
                /^## (.*)$/gm,
                "<h2>$1</h2>"
            );


        html =
            html.replace(
                /^# (.*)$/gm,
                "<h1>$1</h1>"
            );



        /*
         * =========================
         * BLOCKQUOTE
         * =========================
         */

        html =
            html.replace(
                /^> (.*)$/gm,
                "<blockquote>$1</blockquote>"
            );



        /*
         * =========================
         * BOLD
         * =========================
         */

        html =
            html.replace(
                /\*\*(.*?)\*\*/g,
                "<strong>$1</strong>"
            );



        /*
         * =========================
         * ITALIC
         * =========================
         */

        html =
            html.replace(
                /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
                "<em>$1</em>"
            );



        /*
         * =========================
         * INLINE CODE
         * =========================
         */

        html =
            html.replace(
                /`([^`\n]+)`/g,

                '<code class="inline-code">$1</code>'
            );



        /*
         * =========================
         * LINKS
         * =========================
         */

        html =
            html.replace(
                /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,

                '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
            );



        /*
         * =========================
         * NUMBERED LISTS
         * =========================
         */

        html =
            html.replace(
                /(?:^|\n)(\d+)\.\s+(.+)(?=\n|$)/g,

                function (
                    match,
                    number,
                    item
                ) {

                    return "\n<li>" +
                        item +
                        "</li>";

                }
            );



        /*
         * =========================
         * BULLET LISTS
         * =========================
         */

        html =
            html.replace(
                /(?:^|\n)[-*]\s+(.+)(?=\n|$)/g,

                function (
                    match,
                    item
                ) {

                    return "\n<li>" +
                        item +
                        "</li>";

                }
            );



        /*
         * Convert consecutive <li>
         * elements into lists.
         */

        html =
            html.replace(
                /(<li>.*?<\/li>\s*)+/gs,

                function (list) {

                    return "<ul>" +
                        list +
                        "</ul>";

                }
            );



        /*
         * =========================
         * PARAGRAPHS
         * =========================
         */

        const lines =
            html.split("\n");


        let result = "";

        let paragraph = "";


        for (
            let i = 0;
            i < lines.length;
            i++
        ) {


            const line =
                lines[i].trim();


            /*
             * Don't wrap HTML blocks
             */

            if (
                line.startsWith("<h1>") ||
                line.startsWith("<h2>") ||
                line.startsWith("<h3>") ||
                line.startsWith("<ul>") ||
                line.startsWith("<li>") ||
                line.startsWith("<blockquote>") ||
                line.startsWith("<div")
            ) {


                if (paragraph.trim()) {

                    result +=
                        "<p>" +
                        paragraph.trim() +
                        "</p>";

                    paragraph = "";

                }


                result += line;

                continue;

            }


            /*
             * Empty line = paragraph break
             */

            if (!line) {


                if (paragraph.trim()) {

                    result +=
                        "<p>" +
                        paragraph.trim() +
                        "</p>";

                    paragraph = "";

                }


            } else {


                if (paragraph) {
                    paragraph += "<br>";
                }


                paragraph += line;

            }

        }



        if (paragraph.trim()) {

            result +=
                "<p>" +
                paragraph.trim() +
                "</p>";

        }


        /*
         * Remove unnecessary paragraph
         * wrapping around code blocks.
         */

        result =
            result.replace(
                /<p>(\s*<div class="code-block">)/g,
                "$1"
            );


        result =
            result.replace(
                /(<\/div>\s*)<\/p>/g,
                "$1"
            );


        return result;

    }



    /* =========================
       ESCAPE HTML
    ========================== */

    function escapeHtml(text) {

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }



    /* =========================
       COPY CODE
    ========================== */

    async function copyCode(
        codeId,
        button
    ) {


        const code =
            document.getElementById(
                codeId
            );


        if (!code) {
            return;
        }


        try {


            await navigator.clipboard.writeText(
                code.textContent
            );


            const oldText =
                button.textContent;


            button.textContent =
                "Copied ✓";


            setTimeout(
                function () {

                    button.textContent =
                        oldText;

                },
                1500
            );


        } catch (error) {

            console.error(
                "Copy failed:",
                error
            );

        }

    }



    /* =========================
       CURRENT TIME
    ========================== */

    function getCurrentTime() {

        return new Date()
            .toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    }



    /* =========================
       ENTER KEY
    ========================== */

    function handleKeyDown(event) {


        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {


            event.preventDefault();


            sendMessage();

        }

    }



    /* =========================
       AUTO RESIZE
    ========================== */

    function resizeInput(element) {


        element.style.height =
            "auto";


        element.style.height =
            Math.min(
                element.scrollHeight,
                120
            ) + "px";

    }



    /* =========================
       SUGGESTION
    ========================== */

    function useSuggestion(text) {


        messageInput.value =
            text;


        resizeInput(
            messageInput
        );


        messageInput.focus();

    }



    /* =========================
       NEW CHAT
    ========================== */

    function newChat() {


        const messageElements =
            messages.querySelectorAll(
                ".message"
            );


        messageElements.forEach(
            element => {

                element.remove();

            }
        );


        welcome.style.display =
            "block";


        messageInput.value =
            "";


        resizeInput(
            messageInput
        );


        messageInput.focus();

    }



    /* =========================
       CLEAR CHAT
    ========================== */

    function clearChat() {


        const messageElements =
            messages.querySelectorAll(
                ".message"
            );


        messageElements.forEach(
            element => {

                element.remove();

            }
        );


        welcome.style.display =
            "block";

    }



    /* =========================
       CHAT HISTORY
    ========================== */

    function addHistory(question) {


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "history-item";


        item.textContent =
            question;


        item.onclick =
            function () {


                messageInput.value =
                    question;


                resizeInput(
                    messageInput
                );


                messageInput.focus();

            };


        history.prepend(item);


        /*
         * Keep only last 8 chats
         */

        while (
            history.children.length > 8
        ) {

            history.removeChild(
                history.lastChild
            );

        }

    }



    /* =========================
       FILE SELECTED
    ========================== */

    function fileSelected(event) {


        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        messageInput.value =
            "📎 Selected file: " +
            file.name;


        /*
         * Actual file upload will be
         * connected with Spring Boot
         * MultipartFile later.
         */

    }



    /* =========================
       SCROLL
    ========================== */

    function scrollToBottom() {


        messages.scrollTop =
            messages.scrollHeight;

    }



    /* =========================
       INITIAL FOCUS
    ========================== */

    messageInput.focus();


</script>
